# Docker Compose for local testing before AWS deployment
version: '3.8'

services:
  projectdata:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=gemini
      - FRONTEND_URL=http://localhost:8080
    volumes:
      - uploads:/app/backend/uploads
      - visualizations:/app/backend/visualizations
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "healthcheck.js" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
  visualizations:
